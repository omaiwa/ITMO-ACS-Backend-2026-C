services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    volumes:
      - lab2_pg:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend

  user:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: user-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: userdb
      DB_USER: dev
      DB_PASSWORD: dev
      INTERNAL_SERVICE_TOKEN: lab-internal
      JWT_SECRET_KEY: secret
      APP_PORT: "8002"
      APP_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth-service
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user:8002
      INTERNAL_SERVICE_TOKEN: lab-internal
      JWT_SECRET_KEY: secret
      APP_PORT: "8001"
      APP_HOST: "0.0.0.0"
    depends_on:
      user:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  property:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: property-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: propertydb
      DB_USER: dev
      DB_PASSWORD: dev
      INTERNAL_SERVICE_TOKEN: lab-internal
      JWT_SECRET_KEY: secret
      APP_PORT: "8003"
      APP_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  booking:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: booking-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bookingdb
      DB_USER: dev
      DB_PASSWORD: dev
      JWT_SECRET_KEY: secret
      APP_PORT: "8004"
      APP_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  messaging:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: messsaging-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: messagingdb
      DB_USER: dev
      DB_PASSWORD: dev
      PROPERTY_SERVICE_URL: http://property:8003
      INTERNAL_SERVICE_TOKEN: lab-internal
      JWT_SECRET_KEY: secret
      APP_PORT: "8005"
      APP_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      property:
        condition: service_healthy
      booking:
        condition: service_healthy
      messaging:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  lab2_pg: