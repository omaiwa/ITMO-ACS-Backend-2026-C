# Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Prod: docker compose --env-file .env up -d --build

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    volumes:
      - lab2_pg:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-dev}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - backend

  user:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: user-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: userdb
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lab-internal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
      APP_PORT: "8002"
      APP_HOST: "0.0.0.0"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth-service
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user:8002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lab-internal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
      APP_PORT: "8001"
      APP_HOST: "0.0.0.0"
    depends_on:
      user:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  property:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: property-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: propertydb
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lab-internal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
      APP_PORT: "8003"
      APP_HOST: "0.0.0.0"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  booking:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: booking-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bookingdb
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
      APP_PORT: "8004"
      APP_HOST: "0.0.0.0"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  messaging:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: messsaging-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: messagingdb
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      PROPERTY_SERVICE_URL: http://property:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lab-internal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
      APP_PORT: "8005"
      APP_HOST: "0.0.0.0"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      property:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+process.env.APP_PORT+'/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      property:
        condition: service_started
      booking:
        condition: service_started
      messaging:
        condition: service_started
    networks:
      - backend

networks:
  backend:

volumes:
  lab2_pg:
